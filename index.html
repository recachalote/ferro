<script>
window.__ferroErrors = [];
function __ferroErr(msg) {
  window.__ferroErrors.push(String(msg));
  var box = document.getElementById('__ferro_err');
  if (!box) {
    box = document.createElement('div');
    box.id = '__ferro_err';
    box.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:99999;background:#300;color:#ffb4b4;border:1px solid #a33;border-radius:10px;padding:10px 12px;font:11px/1.45 ui-monospace,monospace;max-height:38vh;overflow:auto;white-space:pre-wrap';
    document.body.appendChild(box);
  }
  box.textContent = window.__ferroErrors.slice(-4).join('\n\n');
}
window.addEventListener('error', function (e) { __ferroErr((e.message || 'Erro') + '\n' + (e.filename || '') + ':' + (e.lineno || '')); });
window.addEventListener('unhandledrejection', function (e) { __ferroErr('Promise: ' + (e.reason && e.reason.message ? e.reason.message : e.reason)); });
</script>
